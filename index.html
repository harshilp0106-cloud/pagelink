<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;

          // Define fetch with both getter and setter so extension monkeypatching does not throw
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              }
            });
          } catch (e1) {
            try {
              var proto = Object.getPrototypeOf(window) || Window.prototype;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                }
              });
            } catch (e2) {}
          }
        } catch (e) {}

        // Global safeguard against chrome-extension errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('frame_ant') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
